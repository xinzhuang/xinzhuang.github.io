  AI-Application: ai-application
  AI-Agent: ai-agent
  AI-Programming: ai-programming
  Context-Engineering: context-engineering
  LLM: llm
  # Engineering
  Frontend: frontend
  Backend: backend
  DevOps: devops
  Database: database
  # General
  Tools: tools
  Notes: notes
  Others: others

tag_map:
