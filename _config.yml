  Code-Generation: code-generation
  Code-Review: code-review
  # Context Engineering
  System-Prompt: system-prompt
  CLAUDE-md: claude-md
  Context-Window: context-window
  Prompt-Caching: prompt-caching
  Skill-Design: skill-design
  # AI Platforms
  OpenAI: openai
  Anthropic: anthropic
  LangChain: langchain
  Dify: dify
  # Languages
  Python: python
  TypeScript: typescript
